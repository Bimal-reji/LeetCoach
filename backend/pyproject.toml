[project]
name = "leetcoach-backend"
version = "1.0.0"
description = "LeetCoach AI — backend API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]  # line length enforced by formatter; Depends() in defaults is idiomatic

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
