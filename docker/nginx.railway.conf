# Railway deployment config for the LeetCoach dashboard.
# Copied into the image as an nginx template — the official nginx entrypoint
# substitutes ${PORT} (Railway injects it at runtime; Dockerfile defaults to 80).
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA fallback so client-side routes (e.g. /dashboard) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
